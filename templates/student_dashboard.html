<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="{{ url_for('static', filename='background.css') }}" rel="stylesheet">
    <style>
        .dashboard-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .matches, .events {
            margin-bottom: 30px;
        }

        .matches ul, .events ul {
            list-style-type: none;
            padding-left: 0;
        }

        .matches li, .events li {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f4f4f4;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header-navbar">
        <div class="navbar">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
        <h1 class="header-title">Welcome, {{ full_name }}!</h1>
    </div>

    <div class="container">
        <div class="dashboard-container">
            <h2>Your Matches</h2>
            <div class="matches">
                <ul>
                    {% for match in matches %}
                        <li>
                            {{ match.buddy_name }} - Matched on {{ match.created_at }}
                        </li>
                    {% endfor %}
                </ul>
            </div>

            <h2>Upcoming Events</h2>
            <div class="events">
                <ul>
                    {% for event in events %}
                        <li>
                            {{ event.name }} - Starts on {{ event.start_time }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
